# Build and ship docs.wallarm.com to Cloudflare Workers (DEVOPS-5014).
#
# PR to master   → production-equivalent build + `wrangler versions upload`,
#                  giving one stable preview URL per PR (pr-<N>-wallarm-docs…).
# push to master → `wrangler deploy` + a zone cache purge.
#
# Netlify still runs from netlify.toml in parallel and remains the live site
# until the DNS cutover is verified — this workflow is additive, so rollback is
# just "do not switch DNS" / "switch it back".
name: Cloudflare

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # Terraform module snippets are pulled in as submodules; the build
          # fails on the include directives without them.
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: Build site
        run: scripts/build.sh
        env:
          # Same gate netlify.toml uses. PR previews get the full production
          # build (raw markdown, OG images, feeds) so what reviewers see matches
          # what ships; only image optimisation is skipped, as it changes bytes
          # and not behaviour and costs several minutes.
          CONTEXT: ${{ github.event_name == 'push' && 'production' || 'deploy-preview' }}

      - name: Deploy (production)
        if: github.event_name == 'push'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy

      # Static assets are content-addressed, so the Worker itself serves the new
      # build immediately — this clears the zone-level CDN cache in front of it.
      - name: Purge zone cache
        if: github.event_name == 'push'
        run: |
          curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'

      - name: Upload preview version
        if: github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 4.21+ is required for --preview-alias.
          wranglerVersion: '4'
          # A per-PR alias keeps the preview link stable across pushes, so the
          # PR comment never goes out of date.
          command: versions upload --preview-alias pr-${{ github.event.number }}

      - name: Comment preview link
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URL: https://pr-${{ github.event.number }}-wallarm-docs.${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}.workers.dev
        run: |
          gh pr comment "${{ github.event.number }}" --edit-last --create-if-none \
            --body "Cloudflare preview: $URL"
